quests:
  enter_hotel:
    name: "&dEnter the Slumber Hotel"
    description: "&7Pay Doorman Dave 25 Slumber Tickets to enter."
    npc: doorman_dave
    requires-games: 5
    objective:
      type: PAY_TICKETS
      tickets: 25
    rewards:
      tickets: 0
      commands: []
    dialogue:
      start:
        - "&7[Doorman Dave] &fThe Slumber Hotel houses Bed Wars' most distinguished guests."
        - "&7[Doorman Dave] &fTo enter, you need to give me &e25 Slumber Tickets&f."
        - "&7[Doorman Dave] &fHere is a &aMini Wallet&f – earn tickets by playing Bed Wars!"
      progress:
        - "&7[Doorman Dave] &cYou need more Slumber Tickets. Keep playing!"
      complete:
        - "&7[Doorman Dave] &aThank you for the 25 Slumber Tickets!"
        - "&7[Doorman Dave] &aYou can now enter the Slumber Hotel whenever you like!"

  meet_receptionist:
    name: "&fIntroduce Yourself to the Receptionist"
    description: "&7Speak with the Hotel Receptionist."
    npc: receptionist
    requires-entered: true
    requires-quests: [enter_hotel]
    objective:
      type: TALK
    rewards:
      tickets: 5
    dialogue:
      start:
        - "&7[Receptionist] &fWelcome to the Slumber Hotel!"
        - "&7[Receptionist] &fHelp our guests and return to me to expand your wallet."
      complete:
        - "&7[Receptionist] &aPleasure to meet you. Check &e/slumber quests &afor your log."

  lady_saichi_sheet:
    name: "&fObtain a Bed Sheet"
    description: "&7Bring Lady Saichi a Bed Sheet (destroy an enemy bed)."
    npc: lady_saichi
    requires-entered: true
    requires-quests: [meet_receptionist]
    objective:
      type: COLLECT_ITEM
      item: bed-sheet
      amount: 1
    rewards:
      tickets: 20
      stars: 1
    dialogue:
      start:
        - "&7[Lady Saichi] &fOh, a visitor! My bed sheet is ruined..."
        - "&7[Lady Saichi] &fCould you bring me a &fBed Sheet &7from an enemy bed?"
      progress:
        - "&7[Lady Saichi] &fStill waiting for that Bed Sheet..."
      complete:
        - "&7[Lady Saichi] &aPerfect! Thank you so much."

  general_daku_tea:
    name: "&fThe General's Tea"
    description: "&7Collect 5 Ender Dust for General Daku (throw ender pearls)."
    npc: general_daku
    requires-entered: true
    requires-quests: [meet_receptionist]
    objective:
      type: COLLECT_ITEM
      item: ender-dust
      amount: 200
    rewards:
      tickets: 30
      stars: 1
    dialogue:
      start:
        - "&7[General Daku] &fSoldier! I require &5Ender Dust&f for my tea."
        - "&7[General Daku] &fThrow ender pearls in battle and collect the residue. &e5&f will do."
      progress:
        - "&7[General Daku] &fBring me more Ender Dust, soldier."
      complete:
        - "&7[General Daku] &aExcellent work. Dismissed."

  john_treasure_map:
    name: "&fHelp John Indigos"
    description: "&7Find an Old Treasure Map (break dirt/grass/stone/glass/sand/clay)."
    npc: john_indigos
    requires-entered: true
    requires-quests: [meet_receptionist]
    objective:
      type: COLLECT_ITEM
      item: treasure-map
      amount: 1
    rewards:
      tickets: 25
      stars: 1
    dialogue:
      start:
        - "&7[John Indigos] &fExplorer John Indigos at your service!"
        - "&7[John Indigos] &fI need an &6Old Treasure Map&f. Break dirt, grass, stone, glass..."
      progress:
        - "&7[John Indigos] &fAny luck with that map?"
      complete:
        - "&7[John Indigos] &aSplendid! The expedition can begin!"

  ready_for_nap:
    name: "&aReady for a Nap"
    description: "&7Return to the Receptionist after helping the first three guests."
    npc: receptionist
    requires-entered: true
    requires-quests: [lady_saichi_sheet, general_daku_tea, john_treasure_map]
    objective:
      type: TALK
    rewards:
      upgrade-wallet: true
      tickets: 10
      stars: 2
    dialogue:
      start:
        - "&7[Receptionist] &fYou've been a great help to our guests!"
        - "&7[Receptionist] &fLet me upgrade your wallet..."
      complete:
        - "&7[Receptionist] &aYour wallet can now hold more Slumber Tickets!"
        - "&7[Receptionist] &fTry unlocking hotel doors with &e/slumber door"
  # --- Phase 2: after wallet upgrade (ready_for_nap) ---
  throne_intro:
    name: "&6Throne Room – Meet King Flut"
    description: "&7Unlock Door room-1 (100 tickets), then speak to King Flut."
    npc: king_flut
    requires-entered: true
    requires-quests: [ready_for_nap]
    objective:
      type: TALK
    rewards:
      tickets: 15
      stars: 1
    dialogue:
      start:
        - "&7[King Flut] &fA visitor in my dream? Prove your worth."
        - "&7[King Flut] &fReturn when you have &e10 Tokens of Ferocity&f (kills/assists in games)."
      complete:
        - "&7[King Flut] &aVery well. We shall speak again."

  # Placeholder collect quest for ferocity tokens – uses kill tracking later
  # For now: pay tickets as proxy until Token item is added
  king_ferocity:
    name: "&6Tokens of Ferocity"
    description: "&7Collect &e10 Tokens of Ferocity&7 (chance on kills/final kills)."
    npc: king_flut
    requires-quests: [throne_intro]
    objective:
      type: COLLECT_ITEM
      item: token-of-ferocity
      amount: 10
    rewards:
      tickets: 40
      stars: 2
    dialogue:
      start:
        - "&7[King Flut] &fA visitor in my dream must prove their might."
        - "&7[King Flut] &fBring me &e10 Tokens of Ferocity&f – earned from kills in Bed Wars."
      progress:
        - "&7[King Flut] &cYou lack enough Tokens of Ferocity. Fight harder!"
      complete:
        - "&7[King Flut] &aYour strength is acknowledged. The throne remembers you."

  blacksmith_intro:
    name: "&7The Blacksmith"
    description: "&7Find the Blacksmith after your first wallet upgrade."
    npc: blacksmith
    requires-quests: [ready_for_nap]
    objective:
      type: TALK
    rewards:
      tickets: 5
      stars: 1
    dialogue:
      start:
        - "&7[Blacksmith] &fI forge what the hotel needs."
        - "&7[Blacksmith] &fIf John sends you, bring &e25 Iron Nuggets&f."
      complete:
        - "&7[Blacksmith] &aI'll be here."

  john_hammer_request:
    name: "&eJohn Needs a Hammer"
    description: "&7Talk to John Indigos about a new hammer."
    npc: john_indigos
    requires-quests: [blacksmith_intro, john_treasure_map]
    objective:
      type: TALK
    rewards:
      tickets: 10
      stars: 1
    dialogue:
      start:
        - "&7[John Indigos] &fMy old hammer broke on the last dig!"
        - "&7[John Indigos] &fAsk the Blacksmith to forge an &6Ornate Enchanted Iron Hammer&f."
        - "&7[John Indigos] &fHe'll want Iron Nuggets – pick up iron from generators."
      complete:
        - "&7[John Indigos] &aOff you go – materials to the Blacksmith!"

  blacksmith_forge:
    name: "&7Forge the Hammer"
    description: "&7Deliver &e25 Iron Nuggets&7 to the Blacksmith."
    npc: blacksmith
    requires-quests: [john_hammer_request]
    objective:
      type: COLLECT_ITEM
      item: iron-nugget
      amount: 25
    rewards:
      tickets: 20
      stars: 1
      commands:
        - "slumber giveitem %player% ornate-hammer 1"
    dialogue:
      start:
        - "&7[Blacksmith] &f25 Iron Nuggets and I'll forge John's hammer."
      progress:
        - "&7[Blacksmith] &cNot enough nuggets yet."
      complete:
        - "&7[Blacksmith] &a*clang* It's done. Take this &6Ornate Hammer&a to John."

  john_hammer_deliver:
    name: "&eDeliver the Hammer"
    description: "&7Give the Ornate Hammer to John Indigos."
    npc: john_indigos
    requires-quests: [blacksmith_forge]
    objective:
      type: COLLECT_ITEM
      item: ornate-hammer
      amount: 1
    rewards:
      tickets: 50
      stars: 3
      upgrade-wallet: true
    dialogue:
      start:
        - "&7[John Indigos] &fIs that my new hammer? Hand it over!"
      progress:
        - "&7[John Indigos] &cI still need that Ornate Hammer from the Blacksmith."
      complete:
        - "&7[John Indigos] &aBrilliant! Tell the Receptionist – you've earned a bigger wallet!"
        - "&7[John Indigos] &aThe next floor of the hotel awaits..."


  oasis_intro:
    name: "&bDesert Door – Oasis Spirit"
    description: "&7Unlock door room-3, then speak to the Oasis Spirit."
    npc: oasis_spirit
    requires-quests: [ready_for_nap]
    objective:
      type: TALK
    rewards:
      tickets: 15
      stars: 1
    dialogue:
      start:
        - "&7[Oasis Spirit] &fTraveler... the desert dream thirsts."
        - "&7[Oasis Spirit] &fBring me &e3 Oasis Water&f – found while winning games with water buckets... or as a rare drop."
      complete:
        - "&7[Oasis Spirit] &aThe sands acknowledge you."

  oasis_water_quest:
    name: "&bOffering of Water"
    description: "&7Deliver &e3 Oasis Water&7 to the Oasis Spirit."
    npc: oasis_spirit
    requires-quests: [oasis_intro]
    objective:
      type: COLLECT_ITEM
      item: oasis-water
      amount: 3
    rewards:
      tickets: 60
      stars: 2
      boon: 0.10
    dialogue:
      start:
        - "&7[Oasis Spirit] &fThree vessels of Oasis Water. That is the price."
      progress:
        - "&7[Oasis Spirit] &cThe offering is incomplete."
      complete:
        - "&7[Oasis Spirit] &aThe oasis blooms. A boon of tickets is yours."

  arcade_intro:
    name: "&bArcade Player"
    description: "&7Unlock room-8, meet the Arcade Player (repeatable ticket sink later)."
    npc: arcade_player
    requires-quests: [ready_for_nap]
    objective:
      type: TALK
    rewards:
      tickets: 5
    dialogue:
      start:
        - "&7[Arcade Player] &fBeep boop. Bring iron nuggets and I'll trade tickets."
      complete:
        - "&7[Arcade Player] &aCome back with nuggets anytime."

  arcade_nuggets:
    name: "&bIron Nugget Trade"
    description: "&7Turn in 10 Iron Nuggets for tickets (repeatable)."
    npc: arcade_player
    requires-quests: [arcade_intro]
    repeatable: true
    objective:
      type: COLLECT_ITEM
      item: iron-nugget
      amount: 10
    rewards:
      tickets: 50
    dialogue:
      start:
        - "&7[Arcade Player] &f10 Iron Nuggets = 50 tickets. Deal?"
      progress:
        - "&7[Arcade Player] &cNot enough nuggets."
      complete:
        - "&7[Arcade Player] &aTrade complete! Come back anytime."



  ceo_intro:
    name: "&7Glass Door – Meet the CEO"
    description: "&7Unlock room-7, speak with the CEO."
    npc: ceo
    requires-quests: [ready_for_nap]
    objective:
      type: TALK
    rewards:
      tickets: 15
      stars: 1
    dialogue:
      start:
        - "&7[CEO] &fSuccess is measured in victories."
        - "&7[CEO] &fBring me &eProof of Success&f – win Bed Wars games."
      complete:
        - "&7[CEO] &aWe will talk business when you have proof."

  ceo_wins:
    name: "&7Proof of Success"
    description: "&7Deliver &e10 Proof of Success&7 (earned by winning games)."
    npc: ceo
    requires-quests: [ceo_intro]
    objective:
      type: COLLECT_ITEM
      item: proof-of-success
      amount: 10
    rewards:
      tickets: 50
      stars: 2
    dialogue:
      start:
