# ============================================================
#  HOTEL STARS
# ============================================================
stars:
  # Display name
  name: "Hotel Star"
  name-plural: "Hotel Stars"

# ============================================================
#  TICKET MACHINE (lobby NPC or /slumber machine)
# ============================================================
ticket-machine:
  enabled: true
  cost: 10
  # Weighted rewards – higher weight = more common
  rewards:
    nothing:
      name: "&7Nothing..."
      weight: 40
      tickets: 0
    small_refund:
      name: "&aSmall refund"
      weight: 25
      tickets: 5
    medium_refund:
      name: "&aTicket burst"
      weight: 15
      tickets: 15
    jackpot:
      name: "&6&lJACKPOT"
      weight: 3
      tickets: 50
      stars: 1
    pillow:
      name: "&fComfy Pillow"
      weight: 8
      item: comfy-pillow
      item-amount: 1
    silver:
      name: "&eSilver Coin"
      weight: 9
      item: silver-coin
      item-amount: 1
    # Hook cosmetics plugin later, e.g.:
    # cosmetic_glyph:
    #   name: "&bRandom Glyph"
    #   weight: 2
    #   commands:
    #     - "bwcosmetics give %player% glyph random"

# ============================================================
#  ROOM STORY QUESTS (Phase 2 – expand over time)
#  Unlock door first, then talk to room NPC
# ============================================================
# Additional NPCs for room quests – set citizens-id after creating
# npcs already defined above; extend as needed:
#   king_flut, blacksmith, oasis_spirit, arcade_player, ...


# ============================================================
#  COSMETICS SHOP HOOKS
#  Commands run as console. Adjust to your cosmetics plugin.
#  BedWars1058-Cosmetics / Mher examples – change as needed.
# ============================================================
cosmetics-shop:
  enabled: true
  # currency: tickets spent via /slumber cosmetics or future GUI
  entries:
    glyph_example:
      name: "&bExample Glyph"
      cost: 200
      commands:
        - "bw cosmetics give %player% glyph example"
    kill_effect_example:
      name: "&cExample Kill Effect"
      cost: 350
      commands:
        - "bw cosmetics give %player% killeffect example"


# ============================================================
#  LOBBY JOURNAL ITEM (given on join if lobby)
# ============================================================
lobby-journal:
  enabled: true
  slot: 7
  material: BED
  name: "&dSlumber Quest Log"
  lore:
    - "&7Right-click to open your quest log"
    - "&8Slumber Hotel"


# ============================================================
#  SOUNDS (1.8 names)
# ============================================================
sounds:
  ticket-earn: ORB_PICKUP
  quest-complete: LEVEL_UP
  door-unlock: ANVIL_LAND
  machine-roll: CLICK


# ============================================================
#  ACTION BAR (lobby tickets – needs Spigot API)
# ============================================================
action-bar:
  enabled: true
  format: "&dTickets: &e%tickets%&7/&e%cap%"

# ============================================================
#  SPARK PLUG LOCATION (right-click this block)
#  Set to the black tarp / prop coords on your hotel map
# ============================================================
spark-plug:
  enabled: true
  world: "world"
  x: 25
  y: 70
  z: -14


# ============================================================
#  STAR MILESTONES → permanent ticket boons
# ============================================================
star-milestones:
  5: 0.05
  10: 0.05
  15: 0.05
  20: 0.10
  30: 0.10
  40: 0.15
  50: 0.20

# NPC visibility: guests hidden until listed quests done
# (doorman_dave / receptionist / ticket_machine always visible)
npc-visibility:
  enabled: true
