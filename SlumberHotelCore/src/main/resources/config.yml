# ============================================================
#  SpumberHotelCore v1.1 - Hypixel-style BedWars Slumber Hotel
#  1.8.8 | BedWars2023 5.0.0 | PlayerPoints | BWProxy2023
# ============================================================

debug: false
language: en

# AUTO | LOBBY | ARENA
server-type: AUTO

tickets:
  name: "Slumber Ticket"
  name-plural: "Slumber Tickets"
  gains:
    kill: 1
    final-kill: 5
    bed-destroy: 10
    win: 20
    play-time-minutes: 5
  global-multiplier: 1.0

wallet:
  starting-capacity: 25
  tiers:
    - 25
    - 99
    - 500
    - 5000
    - 10000
    - 40000
    - 100000
  meta-key: "slumber.wallet.tier"


# ============================================================
#  COSTS (used by placeholders %slumber_needed_*% and menus)
# ============================================================
costs:
  # Tickets required to enter the hotel (Doorman Dave)
  hotel-entry: 25
  # Tickets required to upgrade wallet to each tier (index = target tier)
  # tier 0→1 costs first value, 1→2 second, etc.
  wallet-upgrades:
    - 0
    - 50
    - 100
    - 250
    - 500
    - 1000
    - 2500
  # Door unlock costs (room keys)
  doors:
    room-1: 30
    room-2: 50
    room-3: 75
    room-4: 100
    room-5: 150
    vip-suite: 300
    penthouse: 500
  # Quest turn-in display costs (informational)
  quests:
    bed-sheet: 0
    comfy-pillow: 0
    ender-dust: 0

# ============================================================
#  SPECIAL ITEMS
# ============================================================
special-items:
  bed-sheet:
    material: WOOL
    data: 0
    name: "&fBed Sheet"
    lore:
      - "&7Taken from an enemy bed."
      - "&8Quest Item"
    drop-chance-on-bed: 1.0
  comfy-pillow:
    material: WOOL
    data: 0
    name: "&fComfy Pillow"
    lore:
      - "&7Found near an enemy generator."
      - "&8Quest Item"
    # Chance when collecting from generators (PlayerGeneratorCollectEvent)
    generator-collect-chance: 0.08
  ender-dust:
    material: SULPHUR
    data: 0
    name: "&5Ender Dust"
    lore:
      - "&7Residue from an ender pearl."
      - "&8Quest Item"
  treasure-map:
    material: MAP
    data: 0
    name: "&6Old Treasure Map"
    lore:
      - "&7Found while breaking blocks."
      - "&8Quest Item"
    break-blocks:
      - DIRT
      - GRASS
      - STONE
      - GLASS
      - SAND
      - CLAY
      - HARD_CLAY
    chance: 0.02
  iron-nugget:
    material: IRON_INGOT
    data: 0
    name: "&7Iron Nugget"
    lore:
      - "&7A small piece of iron."
      - "&8Quest Item"
    generator-chance: 0.15
  token-of-ferocity:
    material: MAGMA_CREAM
    data: 0
    name: "&cToken of Ferocity"
    lore:
      - "&7Proof of combat prowess."
      - "&8Quest Item"
    kill-chance: 0.20
    final-kill-chance: 0.35
  ornate-hammer:
    material: IRON_PICKAXE
    data: 0
    name: "&6Ornate Enchanted Iron Hammer"
    lore:
      - "&7Forged by the hotel Blacksmith."
      - "&8Quest Item"
  oasis-water:
    material: WATER_BUCKET
    data: 0
    name: "&bOasis Water"
    lore:
      - "&7From the desert dream."
      - "&8Quest Item"
    win-chance: 0.25
  proof-of-success:
    material: PAPER
    data: 0
    name: "&aProof of Success"
    lore:
      - "&7Awarded for winning a game."
      - "&8Quest Item"
    win-chance: 1.0
  wool-cable:
    material: STRING
    data: 0
    name: "&fSpare Wool Cable"
    lore:
      - "&7From enemy wool."
      - "&8Quest Item"
    wool-break-chance: 0.30
  diamond-fragment:
    material: DIAMOND
    data: 0
    name: "&bDiamond Fragment"
    lore:
      - "&7Shattered diamond residue."
      - "&8Quest Item"
    diamond-collect-chance: 0.12
  gold-bar:
    material: GOLD_INGOT
    data: 0
    name: "&6Gold Bar"
    lore:
      - "&7Unspent gold from a finished game."
      - "&8Quest Item"
  void-husk:
    material: SULPHUR
    data: 0
    name: "&8Void Husk"
    lore:
      - "&7Residue of a void death."
      - "&8Quest Item"
  spark-plug:
    material: REDSTONE
    data: 0
    name: "&cSpark Plug"
    lore:
      - "&7Found near the hotel exterior."
      - "&8Quest Item"
  silver-coin:
    material: GOLD_NUGGET
    data: 0
    name: "&eSilver Coin"
    lore:
      - "&7From shopping in-game."
      - "&8Quest Item"
    # Chance on shop buy (ShopBuyEvent)
    shop-buy-chance: 0.12

# ============================================================
#  DAILY QUESTS (plugin-side, resets every day UTC)
# ============================================================
daily-quests:
  enabled: true
  reset-hour-utc: 0
  # Players can have this many active daily quests
  max-active: 3
  # Quest pool – plugin picks random ones each day per player
  pool:
    daily_kills:
      name: "&cSlayer"
      description: "&7Get &e10 kills &7in Bed Wars"
      type: KILLS
      target: 10
      reward-tickets: 15
    daily_finals:
      name: "&4Final Blow"
      description: "&7Get &e3 final kills"
      type: FINAL_KILLS
      target: 3
      reward-tickets: 20
    daily_beds:
      name: "&6Bed Raider"
      description: "&7Destroy &e2 beds"
      type: BEDS
      target: 2
      reward-tickets: 25
    daily_wins:
      name: "&aVictor"
      description: "&7Win &e1 game"
      type: WINS
      target: 1
      reward-tickets: 30
    daily_games:
      name: "&bWarm-up"
      description: "&7Play &e3 games"
      type: GAMES
      target: 3
      reward-tickets: 12

# ============================================================
#  STORAGE
#  type: YAML | MYSQL
#  MySQL uses HikariCP + connector SHADDED inside this plugin.
#  Just create an empty database in your panel, then fill these in.
# ============================================================
storage:
  # Change to MYSQL to use your database panel
  type: YAML
  mysql:
    host: localhost
    port: 3306
    database: slumberhotel
    username: root
    password: "password"
    table-prefix: sh_
    pool-size: 10
    min-idle: 2

# ============================================================
#  MESSAGES
# ============================================================
messages:
  prefix: "&8[&dSlumber Hotel&8] &r"
  tickets-gained: "&a+{amount} {name} &7({reason})"
  wallet-full: "&cYour wallet is full! ({current}/{max}) Talk to the Receptionist."
  wallet-upgraded: "&aWallet capacity increased to &e{max}&a!"
  no-permission: "&cYou don't have permission."
  player-not-found: "&cPlayer not found."
  reloaded: "&aConfiguration reloaded."
  tickets-balance: "&7You have &e{amount} &7{name}."
  tickets-balance-other: "&e{player} &7has &e{amount} &7{name}."
  daily-complete: "&aDaily quest complete: &e{name}&a! +{reward} tickets"
  daily-progress: "&7[{name}] &e{current}&7/&e{target}"
  daily-reset: "&7Your daily hotel quests have been refreshed."

integrations:
  playerpoints: true
  placeholderapi: true
  bedwars2023: true
  bwproxy2023: true
  luckperms: true
  citizens: true
  betonquest: true

# ============================================================
#  BUILT-IN QUESTS (no BetonQuest – works on 1.8.8/1.8.9)
# ============================================================
quests-settings:
  talk-complete-on-start: false

npcs:
  # citizens-id: set after /npc create using /npc id
  # names: alternate names that also match on right-click
  doorman_dave:
    citizens-id: 1
    names: ["Doorman Dave", "Dave"]
  receptionist:
    citizens-id: 2
    names: ["Hotel Receptionist", "Receptionist"]
  lady_saichi:
    require-quest: meet_receptionist
    citizens-id: 3
    names: ["Lady Saichi", "Saichi"]
  general_daku:
    require-quest: meet_receptionist
    citizens-id: 4
    names: ["General Daku", "Daku"]
  john_indigos:
    require-quest: meet_receptionist
    citizens-id: 5
    names: ["Explorer John Indigos", "John Indigos", "John"]
  king_flut:
    require-quest: meet_receptionist
    citizens-id: 6
    names: ["King Flut", "Flut"]
  blacksmith:
    citizens-id: 7
    names: ["Blacksmith"]
  arcade_player:
    citizens-id: 8
    names: ["Arcade Player"]
  oasis_spirit:
    require-quest: meet_receptionist
    citizens-id: 9
    names: ["Oasis Spirit", "Spirit"]
  ticket_machine:
    citizens-id: 10
    names: ["Ticket Machine", "Slumber Ticket Machine"]
  hostess_katrina:
    require-quest: meet_receptionist
    citizens-id: 11
    names: ["Hostess Katrina", "Katrina"]
  ceo:
    citizens-id: 12
    names: ["CEO", "The CEO"]
  quiz_host:
    citizens-id: 13
    names: ["Quiz Show Host", "Quiz Host"]
  skyblock_player:
    citizens-id: 14
    names: ["SkyBlock Player"]
  ratman:
    citizens-id: 15
    names: ["The Ratman", "Ratman"]

